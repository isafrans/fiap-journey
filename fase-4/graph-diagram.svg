<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0e1a"/>
      <stop offset="100%" style="stop-color:#1a1830"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#5B21B6"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" rx="16" fill="url(#bg)"/>

  <!-- Grid dots -->
  <g opacity="0.07">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#a78bfa"/>
    </pattern>
    <rect width="720" height="420" rx="16" fill="url(#dots)"/>
  </g>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#a78bfa" letter-spacing="3" opacity="0.9">ESTRUTURA DE GRAFO</text>
  <line x1="180" y1="48" x2="540" y2="48" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>

  <!-- ===== UNDIRECTED GRAPH (left panel) ===== -->
  <rect x="28" y="62" width="310" height="290" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.3"/>
  <text x="183" y="85" text-anchor="middle" font-size="11" fill="#a78bfa" font-weight="600" letter-spacing="1.5">GRAFO NÃO-DIRIGIDO</text>

  <!-- Edges (undirected) -->
  <!-- A-B -->
  <line x1="120" y1="155" x2="230" y2="135" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <!-- A-C -->
  <line x1="120" y1="155" x2="105" y2="255" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <!-- B-D -->
  <line x1="230" y1="135" x2="295" y2="225" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <!-- B-C -->
  <line x1="230" y1="135" x2="105" y2="255" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <!-- C-E -->
  <line x1="105" y1="255" x2="185" y2="315" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <!-- D-E -->
  <line x1="295" y1="225" x2="185" y2="315" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>

  <!-- Weight labels -->
  <text x="176" y="134" text-anchor="middle" font-size="10" fill="#c4b5fd" opacity="0.85">4</text>
  <text x="103" y="202" text-anchor="middle" font-size="10" fill="#c4b5fd" opacity="0.85">2</text>
  <text x="272" y="175" text-anchor="middle" font-size="10" fill="#c4b5fd" opacity="0.85">6</text>
  <text x="162" y="196" text-anchor="middle" font-size="10" fill="#c4b5fd" opacity="0.85">3</text>
  <text x="138" y="296" text-anchor="middle" font-size="10" fill="#c4b5fd" opacity="0.85">5</text>
  <text x="247" y="280" text-anchor="middle" font-size="10" fill="#c4b5fd" opacity="0.85">7</text>

  <!-- Nodes (undirected) -->
  <!-- A -->
  <circle cx="120" cy="155" r="22" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="120" cy="155" r="22" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="120" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="white">A</text>

  <!-- B -->
  <circle cx="230" cy="135" r="22" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="230" cy="135" r="22" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="230" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="white">B</text>

  <!-- C -->
  <circle cx="105" cy="255" r="22" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="105" cy="255" r="22" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="105" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="white">C</text>

  <!-- D -->
  <circle cx="295" cy="225" r="22" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="295" cy="225" r="22" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="295" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="white">D</text>

  <!-- E -->
  <circle cx="185" cy="315" r="22" fill="url(#nodeGrad)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="185" cy="315" r="22" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="185" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="white">E</text>

  <!-- Legend left -->
  <circle cx="62" cy="358" r="7" fill="url(#nodeGrad)"/>
  <text x="76" y="363" font-size="11" fill="#c4b5fd">Vértice</text>
  <line x1="140" y1="358" x2="168" y2="358" stroke="#a78bfa" stroke-width="2"/>
  <text x="176" y="363" font-size="11" fill="#c4b5fd">Aresta (peso)</text>

  <!-- ===== DIRECTED GRAPH (right panel) ===== -->
  <rect x="382" y="62" width="310" height="290" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#2563EB" stroke-width="1" stroke-opacity="0.3"/>
  <text x="537" y="85" text-anchor="middle" font-size="11" fill="#93c5fd" font-weight="600" letter-spacing="1.5">GRAFO DIRIGIDO</text>

  <!-- Directed edges with arrows -->
  <!-- 1→2 -->
  <line x1="467" y1="148" x2="595" y2="128" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- 1→3 -->
  <line x1="458" y1="168" x2="448" y2="242" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- 2→4 -->
  <line x1="608" y1="148" x2="638" y2="218" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- 3→5 -->
  <line x1="462" y1="270" x2="516" y2="318" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- 4→5 -->
  <line x1="638" y1="248" x2="560" y2="320" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- 2→3 -->
  <line x1="599" y1="143" x2="476" y2="248" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Nodes (directed) -->
  <!-- 1 -->
  <circle cx="455" cy="155" r="22" fill="url(#nodeGrad2)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="455" cy="155" r="22" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="455" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="white">1</text>

  <!-- 2 -->
  <circle cx="612" cy="135" r="22" fill="url(#nodeGrad2)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="612" cy="135" r="22" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="612" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="white">2</text>

  <!-- 3 -->
  <circle cx="455" cy="262" r="22" fill="url(#nodeGrad2)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="455" cy="262" r="22" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="455" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="white">3</text>

  <!-- 4 -->
  <circle cx="650" cy="235" r="22" fill="url(#nodeGrad2)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="650" cy="235" r="22" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="650" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="white">4</text>

  <!-- 5 -->
  <circle cx="540" cy="330" r="22" fill="url(#nodeGrad2)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="540" cy="330" r="22" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="540" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="white">5</text>

  <!-- Legend right -->
  <circle cx="408" cy="358" r="7" fill="url(#nodeGrad2)"/>
  <text x="422" y="363" font-size="11" fill="#93c5fd">Vértice</text>
  <line x1="486" y1="358" x2="514" y2="358" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="522" y="363" font-size="11" fill="#93c5fd">Aresta dirigida</text>

  <!-- Bottom caption -->
  <text x="360" y="400" text-anchor="middle" font-size="11" fill="#6d6a8a" letter-spacing="0.5">
    G = (V, E)  •  V = vértices  •  E = arestas
  </text>
</svg>
